name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Differential tests (pytest)
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/unittest2 -q
